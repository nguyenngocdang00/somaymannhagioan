<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảo Mật Quản Trị Xổ Số</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        /* Giao diện đăng nhập */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #d32f2f; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-box h2 { margin-bottom: 20px; color: #333; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 8px; font-size: 1.2rem; text-align: center; }
        
        /* Giao diện Admin */
        .admin-box { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: none; }
        h2 { color: #d32f2f; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .prize-group { margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 8px; border-left: 4px solid #d32f2f; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #444; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .status-info { font-size: 0.85rem; color: #666; margin-top: 5px; }
        .btn-update { width: 100%; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1rem; }
        .btn-logout { background: #666; margin-top: 10px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>🔒 QUẢN TRỊ VIÊN</h2>
        <input type="password" id="adminPassword" placeholder="Nhập mã truy cập...">
        <button class="btn-update" onclick="checkLogin()">ĐĂNG NHẬP</button>
    </div>
</div>

<div class="admin-box" id="adminContent">
    <h2>⚙️ QUẢN TRỊ KẾT QUẢ</h2>
    <div id="loadingStatus" style="text-align: center; color: #666;">⏳ Đang tải dữ liệu...</div>
    <div id="inputControls"></div>
    <button class="btn-update" onclick="uploadToFirebase()">🚀 CẬP NHẬT LÊN HỆ THỐNG</button>
    <button class="btn-update btn-logout" onclick="logout()">THOÁT</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const encodedURL = "aHR0cHM6Ly9zb3hvbmhhZ2lvYW4tZGVmYXVsdC1ydGRiLmFzaWEtc291dGhlYXN0MS5maXJlYmFzZWRhdGFiYXNlLmFwcA==";
    const firebaseConfig = { databaseURL: atob(encodedURL) };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // MẬT KHẨU TRUY CẬP (Bạn có thể đổi '123456' thành mật khẩu của bạn)
    const ADMIN_KEY = "gioan2026"; 

    const config = [
        { key: 'db', name: 'Giải Đặc Biệt' },
        { key: 'g1', name: 'Giải Nhất' },
        { key: 'g2', name: 'Giải Nhì' },
        { key: 'g3', name: 'Giải Ba' },
        { key: 'g4', name: 'Giải Tư' },
        { key: 'g5', name: 'Giải Năm' },
        { key: 'g6', name: 'Giải Sáu' },
        { key: 'gkk', name: 'Giải Khuyến Khích' }
    ];

    // Kiểm tra đăng nhập khi mở trang
    window.checkLogin = function() {
        const pass = document.getElementById('adminPassword').value;
        if (pass === ADMIN_KEY) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadDatabase();
        } else {
            alert("❌ Sai mật khẩu!");
        }
    };

    window.logout = function() {
        location.reload();
    };

    // Tạo các ô nhập liệu
    const container = document.getElementById('inputControls');
    config.forEach(p => {
        container.innerHTML += `
            <div class="prize-group">
                <label>${p.name}:</label>
                <input type="text" id="in_${p.key}" placeholder="Ví dụ: 12345, 67890">
                <div class="status-info" id="status_${p.key}">Chưa có dữ liệu</div>
            </div>`;
    });

    function loadDatabase() {
        const resultsRef = ref(db, 'lottery_results');
        onValue(resultsRef, (snapshot) => {
            const data = snapshot.val();
            document.getElementById('loadingStatus').style.display = 'none';
            if (data) {
                config.forEach(p => {
                    const prizeData = data[p.key];
                    if (prizeData) {
                        const valString = Array.isArray(prizeData) ? prizeData.join(', ') : Object.values(prizeData).join(', ');
                        document.getElementById(`in_${p.key}`).value = valString;
                        document.getElementById(`status_${p.key}`).innerHTML = `✅ Hiện tại: <b style="color:#d32f2f">${valString}</b>`;
                    }
                });
            }
        }, { onlyOnce: true });
    }

    window.uploadToFirebase = function() {
        const dataToUpload = {};
        const allNewNumbers = [];
        const duplicates = [];

        for (const p of config) {
            const val = document.getElementById(`in_${p.key}`).value;
            const nums = val ? val.split(',').map(s => s.trim()).filter(s => s !== "") : [];
            
            for (const n of nums) {
                if (allNewNumbers.includes(n)) {
                    duplicates.push(n);
                } else {
                    allNewNumbers.push(n);
                }
            }
            dataToUpload[p.key] = nums;
        }

        if (duplicates.length > 0) {
            alert(`⚠️ CẢNH BÁO TRÙNG LẶP!\nSố: ${[...new Set(duplicates)].join(', ')} bị nhập trùng.`);
            return;
        }

        set(ref(db, 'lottery_results'), dataToUpload)
            .then(() => alert("✅ Đã đồng bộ dữ liệu thành công!"))
            .catch(err => alert("❌ Lỗi: " + err.message));
    };
</script>
</body>
</html>
