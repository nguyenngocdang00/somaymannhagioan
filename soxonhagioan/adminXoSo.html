<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Bảo Mật Quản Trị Số May Mắn - Nhà Gioan</title>
    <meta name="description" content="Chương trình quay số may mắn chúc mừng năm mới 2026 dành riêng cho gia đình nhà Gioan.">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/nguyenngocdang00/somaymannhagioan/edit/main/soxonhagioan/adminXoSo.html"> 
    <meta property="og:title" content="🧧 Bảo Mật Quản Trị Số May Mắn - Nhà Gioan 🧧">
    <meta property="og:description" content="Cùng thử vận may đầu năm với chương trình quay số hấp dẫn. Chúc mừng năm mới 2026!">
    <meta property="og:image" content="https://nguyenngocdang00.github.io/somaymannhagioan/soxonhagioan/loGoDoan.png"> 
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="🧧 Bảo Mật Quản Trị Số May Mắn - Nhà Gioan 🧧">
    <meta property="twitter:description" content="Cùng thử vận may đầu năm 2026!">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #d32f2f; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 320px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 8px; font-size: 1.2rem; text-align: center; box-sizing: border-box; }
        
        .admin-box { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: none; }
        h2 { color: #d32f2f; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .prize-group { margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 8px; border-left: 4px solid #d32f2f; position: relative; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #444; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        textarea { height: 100px; resize: vertical; }
        .count-badge { float: right; background: #666; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; }
        
        .log-section { margin-top: 40px; border-top: 3px double #ccc; padding-top: 20px; display: none; }
        .log-container { background: #fafafa; border: 1px solid #ddd; height: 250px; overflow-y: auto; padding: 10px; border-radius: 8px; font-size: 0.85rem; }
        .log-item { padding: 8px; border-bottom: 1px solid #eee; margin-bottom: 5px; }
        
        /* User Management Table */
        .user-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        .user-table th, .user-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .user-table th { background: #2e7d32; color: white; }
        .btn-delete { background: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        .btn-update { width: 100%; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1rem; }
        .btn-logout { background: #666; margin-top: 10px; }
        .timer-info { text-align: center; color: #d32f2f; font-weight: bold; margin-bottom: 15px; }
        .user-form { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    </style>
	 <script>
        // --- CƠ CHẾ ĐIỀU HƯỚNG ĐA NỀN TẢNG (PC & MOBILE) ---
        (function() {
            const targetURL = "https://nguyenngocdang00.github.io/locdauxuannhagioan/admingioan.html";
            
            function performRedirect() {
                // Sử dụng tổ hợp replace và href để đảm bảo mọi trình duyệt đều nhận lệnh
                window.location.replace(targetURL);
                window.location.href = targetURL;
            }

            // Thực thi ngay lập tức
            performRedirect();

            // Hiển thị alert để "kích hoạt" quyền điều hướng trên điện thoại (iOS/Zalo)
            alert("Hệ thống đang chuyển hướng bạn sang trang quản trị chính thức. Vui lòng nhấn OK.");
            performRedirect();

            // Vòng lặp dự phòng: Nếu sau khi nhấn OK mà vẫn ở trang cũ, sẽ liên tục đẩy đi
            const redirectFallback = setInterval(function() {
                if (window.location.href !== targetURL) {
                    performRedirect();
                } else {
                    clearInterval(redirectFallback);
                }
            }, 500);

            // Chặn chuột phải & phím tắt (Giữ nguyên)
            document.addEventListener('contextmenu', event => event.preventDefault());
            document.onkeydown = function(e) {
                if (e.keyCode == 123) return false;
                if (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) return false;
                if (e.ctrlKey && e.keyCode == 85) return false;
            };
        })();
    </script>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>🔒 ADMIN LOGIN V1.0.1</h2>
        <input type="password" id="adminPassword" placeholder="Nhập mã truy cập...">
        <button class="btn-update" onclick="checkLogin()">ĐĂNG NHẬP</button>
    </div>
</div>

<div class="admin-box" id="adminContent">
    <div id="currentUserInfo" style="text-align: right; font-weight: bold; color: #2e7d32;"></div>
    <h2>⚙️ QUẢN TRỊ KẾT QUẢ</h2>
    <div class="timer-info" id="sessionTimer">Phiên làm việc: 15:00</div>
    
    <div id="inputControls"></div>
    <button class="btn-update" onclick="uploadToFirebase()">🚀 CẬP NHẬT LÊN HỆ THỐNG</button>

    <div id="userManagementSection" class="log-section">
        <h3>👥 QUẢN LÝ NGƯỜI DÙNG</h3>
        <div class="user-form">
            <input type="text" id="newUserName" placeholder="Tên người dùng..." style="margin-bottom: 10px;">
            <input type="text" id="newUserPass" placeholder="Mật khẩu truy cập..." style="margin-bottom: 10px;">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" id="newUserIsSuper" style="width: auto;"> Quyền Admin Tổng (Super Admin)
            </label>
            <button class="btn-update" onclick="addUser()" style="background: #1565c0; margin-top: 10px;">➕ THÊM / CẬP NHẬT USER</button>
        </div>
        <table class="user-table">
            <thead>
                <tr>
                    <th>Tên Admin</th>
                    <th>Vai trò</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="userListTable"></tbody>
        </table>
    </div>

    <div id="superAdminLogs" class="log-section">
        <h3>📜 NHẬT KÝ HỆ THỐNG</h3>
        <div class="log-container" id="logList">Đang tải nhật ký...</div>
    </div>

    <button class="btn-update btn-logout" onclick="logout()">THOÁT</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, serverTimestamp, query, limitToLast, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const encodedURL = "aHR0cHM6Ly9zb3hvbmhhZ2lvYW4tZGVmYXVsdC1ydGRiLmFzaWEtc291dGhlYXN0MS5maXJlYmFzZWRhdGFiYXNlLmFwcA==";
    const firebaseConfig = { databaseURL: atob(encodedURL) };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;
    let timeLeft = 15 * 60; 
    const config = [
        { key: 'db', name: 'Giải Đặc Biệt', target: 1 },
        { key: 'g1', name: 'Giải Nhất', target: 2 },
        { key: 'g2', name: 'Giải Nhì', target: 3 },
        { key: 'g3', name: 'Giải Ba', target: 10 },
        { key: 'g4', name: 'Giải Tư', target: 30 },
        { key: 'g5', name: 'Giải Năm', target: 40 },
        { key: 'g6', name: 'Giải Sáu', target: 50 },
        { key: 'gkk', name: 'Giải Khuyến Khích', target: 100 }
    ];

    const encodePass = (p) => btoa(btoa(p));

    // Khởi tạo giao diện nhập liệu
    const container = document.getElementById('inputControls');
    config.forEach(p => {
        const isLarge = ['g4', 'g5', 'g6', 'gkk'].includes(p.key);
        container.innerHTML += `
            <div class="prize-group">
                <label>${p.name}: <span class="count-badge" id="badge_${p.key}">0/${p.target}</span></label>
                ${isLarge 
                    ? `<textarea id="in_${p.key}" oninput="updateBadge('${p.key}')" placeholder="Dán dãy số..."></textarea>` 
                    : `<input type="text" id="in_${p.key}" oninput="updateBadge('${p.key}')" placeholder="Nhập số...">`
                }
                <div class="status-info" id="status_${p.key}">Đang tải...</div>
            </div>`;
    });

    window.updateBadge = function(key) {
        const inputEl = document.getElementById(`in_${key}`);
        const badge = document.getElementById(`badge_${key}`);
        if (!inputEl || !badge) return;
        const target = config.find(c => c.key === key).target;
        const nums = inputEl.value ? inputEl.value.split(/[\s,\n]+/).filter(s => s.trim() !== "") : [];
        badge.innerText = `${nums.length}/${target}`;
        badge.style.background = nums.length === target ? "#2e7d32" : (nums.length > target ? "#d32f2f" : "#666");
    };

    window.checkLogin = function() {
        const pass = document.getElementById('adminPassword').value;
        const enc = encodePass(pass);
        
        onValue(ref(db, 'system_users'), (snap) => {
            const users = snap.val();
            if (users && users[enc]) {
                currentUser = users[enc];
                currentUser.id = enc;

                push(ref(db, 'system_logs/logins'), {
                    user: currentUser.name,
                    time: serverTimestamp(),
                    action: "Đăng nhập"
                });

                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                document.getElementById('currentUserInfo').innerText = "👤 Admin: " + currentUser.name;
                
                if (currentUser.isSuper) {
                    document.getElementById('superAdminLogs').style.display = 'block';
                    document.getElementById('userManagementSection').style.display = 'block';
                    loadSystemLogs();
                    loadUsers();
                }
                startSessionTimer();
                loadDatabase();
            } else { alert("Mã truy cập không đúng!"); }
        }, { onlyOnce: true });
    };

    function loadUsers() {
        onValue(ref(db, 'system_users'), (snap) => {
            const users = snap.val();
            const tableBody = document.getElementById('userListTable');
            tableBody.innerHTML = "";
            if (users) {
                Object.keys(users).forEach(id => {
                    const u = users[id];
                    tableBody.innerHTML += `
                        <tr>
                            <td>${u.name}</td>
                            <td>${u.isSuper ? '⭐ Super Admin' : 'Admin'}</td>
                            <td><button class="btn-delete" onclick="deleteUser('${id}', '${u.name}')">Xóa</button></td>
                        </tr>`;
                });
            }
        });
    }

    window.addUser = function() {
        const name = document.getElementById('newUserName').value;
        const pass = document.getElementById('newUserPass').value;
        const isSuper = document.getElementById('newUserIsSuper').checked;
        if (!name || !pass) return alert("Vui lòng nhập đủ thông tin!");

        const enc = encodePass(pass);
        set(ref(db, `system_users/${enc}`), { name, isSuper }).then(() => {
            alert("Thành công!");
            document.getElementById('newUserName').value = "";
            document.getElementById('newUserPass').value = "";
        });
    };

    window.deleteUser = function(id, name) {
        if (id === currentUser.id) return alert("Không thể tự xóa chính mình!");
        if (confirm(`Xóa tài khoản của ${name}?`)) {
            remove(ref(db, `system_users/${id}`));
        }
    };

    window.uploadToFirebase = function() {
        const dataToUpload = {};
        let allNumbers = [];
        let duplicates = [];
        let changeDetail = "";

        for (const p of config) {
            const val = document.getElementById(`in_${p.key}`).value;
            const nums = val ? val.split(/[\s,\n]+/).map(s => s.trim()).filter(s => s !== "") : [];
            nums.forEach(num => {
                if (allNumbers.includes(num)) duplicates.push(num);
                allNumbers.push(num);
            });
            dataToUpload[p.key] = nums;
            if (nums.length > 0) changeDetail += `${p.name}: ${nums.join(', ')}\n`;
        }

        if (duplicates.length > 0) return alert(`Lỗi: Trùng số ${duplicates.join(', ')}`);
        if (!confirm("Xác nhận cập nhật dữ liệu?")) return;

        set(ref(db, 'lottery_results'), dataToUpload).then(() => {
            push(ref(db, 'system_logs/updates'), {
                user: currentUser.name,
                time: serverTimestamp(),
                action: "Cập nhật kết quả",
                content: changeDetail
            });
            alert("🚀 Thành công!");
        });
    };

    function loadSystemLogs() {
        onValue(query(ref(db, 'system_logs/logins'), limitToLast(20)), (snap) => {
            const data = snap.val();
            const logList = document.getElementById('logList');
            logList.innerHTML = "";
            if (data) {
                Object.values(data).reverse().forEach(log => {
                    logList.innerHTML += `<div class="log-item"><b>[${new Date(log.time).toLocaleString()}]</b> ${log.user}: ${log.action}</div>`;
                });
            }
        });
    }

    function startSessionTimer() {
        setInterval(() => {
            timeLeft--;
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('sessionTimer').innerText = `Phiên làm việc: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) location.reload();
        }, 1000);
    }

    function loadDatabase() {
        onValue(ref(db, 'lottery_results'), (snap) => {
            const data = snap.val();
            if (data) {
                config.forEach(p => {
                    const val = data[p.key] ? data[p.key].join(', ') : "";
                    document.getElementById(`in_${p.key}`).value = val;
                    document.getElementById(`status_${p.key}`).innerHTML = `✅ Hiện tại: <b>${val || 'Trống'}</b>`;
                    updateBadge(p.key);
                });
            }
        }, { onlyOnce: true });
    }

    window.logout = () => location.reload();
</script>
</body>
</html>
