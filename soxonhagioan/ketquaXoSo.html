<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Tra Cứu Số May Mắn - Nhà Gioan</title>
    <meta name="description" content="Chương trình quay số may mắn chúc mừng năm mới 2026 dành riêng cho gia đình nhà Gioan.">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nguyenngocdang00.github.io/somaymannhagioan/soxonhagioan/ketquaXoSo.html"> 
    <meta property="og:title" content="🧧 Tra Cứu Số May Mắn - Nhà Gioan 🧧">
    <meta property="og:description" content="Cùng thử vận may đầu năm với chương trình quay số hấp dẫn. Chúc mừng năm mới 2026!">
    <meta property="og:image" content="https://nguyenngocdang00.github.io/somaymannhagioan/soxonhagioan/tao-vong-quay-may-man-2.png"> 
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="🧧 Tra Cứu Số May Mắn - Nhà Gioan 🧧">
    <meta property="twitter:description" content="Cùng thử vận may đầu năm 2026!">
    <meta property="twitter:image" content="https://nguyenngocdang00.github.io/somaymannhagioan/soxonhagioan/tao-vong-quay-may-man-2.png">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --tet-red: #d32f2f; 
            --tet-gold: #ffc107; 
            --dark-red: #b71c1c;
            --bg-color: #fdf2f2;
            --container-bg: #ffffff;
            --text-color: #333;
            --input-bg: #ffffff;
            --table-border: #ffecb3;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --tet-red: #ff5252;
            --tet-gold: #ffd700;
            --dark-red: #880e4f;
            --bg-color: #1a0000;
            --container-bg: #2d0000;
            --text-color: #fff9c4;
            --input-bg: #3d0000;
            --table-border: #5d0000;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .theme-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            padding: 8px 15px;
            background: var(--tet-gold);
            color: var(--dark-red);
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .container { 
            max-width: 900px; 
            width: 100%;
            background: var(--container-bg); 
            padding: 25px; 
            border-radius: 20px; 
            border: 3px solid var(--tet-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            position: relative;
            margin-top: 50px;
        }

        h1 { text-align: center; color: var(--tet-red); font-size: clamp(1.2rem, 5vw, 1.8rem); text-transform: uppercase; }

        .header-title { 
            text-align: center; color: var(--tet-red); font-size: clamp(0.9rem, 4vw, 1.2rem);
            background: rgba(255, 193, 7, 0.2);
            padding: 10px; border-radius: 10px; margin-bottom: 25px;
        }

        .check-box { 
            background: var(--input-bg); padding: 20px; border-radius: 15px; 
            margin-bottom: 20px; display: flex; gap: 10px; border: 1px dashed var(--tet-gold);
        }

        input { 
            flex: 1; padding: 12px; border: 2px solid var(--tet-gold); border-radius: 8px; 
            background: var(--input-bg); color: var(--text-color); font-size: 1rem;
        }

        button { 
            padding: 12px 25px; background: linear-gradient(135deg, var(--tet-red), var(--dark-red)); 
            color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        .result-msg { text-align: center; margin: 10px 0; font-weight: bold; font-size: 1.1rem; min-height: 30px; }
        
        .lucky-wish {
            text-align: center; font-style: italic; color: var(--tet-gold);
            margin-bottom: 15px; font-size: 1rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        th, td { border: 1px solid var(--table-border); padding: 15px 10px; text-align: center; }
        th { background: var(--tet-red); color: white; }
        .prize-name { font-weight: bold; background: rgba(211, 47, 47, 0.05); color: var(--tet-red); width: 35%; }
        .db-highlight { color: var(--tet-red); font-size: 1.6rem; font-weight: bold; }

        .visitor-counter {
            position: fixed; bottom: 20px; left: 20px; background: var(--container-bg);
            padding: 8px 15px; border-radius: 50px; border: 2px solid var(--tet-gold);
            font-size: 0.85rem; font-weight: bold; color: var(--tet-red); z-index: 1000;
        }

        @media (max-width: 600px) {
            .check-box { flex-direction: column; }
            .container { padding: 15px; }
            .theme-switch { top: 10px; right: 10px; padding: 5px 10px; }
        }
    </style>
</head>
<body data-theme="light">

<div class="theme-switch" onclick="toggleTheme()">🌙 CHẾ ĐỘ TỐI</div>

<audio id="winSound" src="https://www.myinstants.com/media/sounds/tada.mp3" preload="auto"></audio>

<div class="visitor-counter">
    LƯỢT TRUY CẬP: <span id="visit-count">0000</span>
</div>

<div class="container">
    <h1>🏆 KẾT QUẢ QUAY SỐ HÔM NAY</h1>
    <h3 class="header-title">🧧 Quay Số May Mắn Chúc Mừng Năm Mới nhà Gioan 🧧</h3>
    
    <div class="check-box">
        <input type="text" id="userTicket" maxlength="4" placeholder="Nhập số vé của bạn...">
        <button id="btnCheck">DÒ SỐ</button>
    </div>

    <div id="checkMessage" class="result-msg"></div>
    <div id="luckyWish" class="lucky-wish"></div> <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Giải</th><th>Số Trúng Thưởng</th></tr>
            </thead>
            <tbody id="viewTable">
                <tr><td colspan="2">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const encodedURL = "aHR0cHM6Ly9zb3hvbmhhZ2lvYW4tZGVmYXVsdC1ydGRiLmFzaWEtc291dGhlYXN0MS5maXJlYmFzZWRhdGFiYXNlLmFwcA==";
    const firebaseConfig = { databaseURL: atob(encodedURL) };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- LỜI CHÚC TẾT NGẪU NHIÊN ---
    const tetholidayWishes = [
        "🧧 Vạn sự như ý - Tỉ sự như mơ!",
        "🧧 Phát tài phát lộc - Tiền vô xồng xộc!",
        "🧧 Sức khỏe dồi dào - Hạnh phúc dâng trào!",
        "🧧 Năm mới thắng lợi mới, niềm vui mới!",
        "🧧 Công thành danh toại - Trẻ mãi không già!",
        "🧧 Gia đình bình an - Hạnh phúc nồng nàn!",
        "🧧 Lộc đầy túi, tim đầy tình, gia đình hạnh phúc!"
    ];

    function showRandomWish() {
        const wishElem = document.getElementById('luckyWish');
        const randomWish = tetholidayWishes[Math.floor(Math.random() * tetholidayWishes.length)];
        wishElem.innerText = randomWish;
    }

    // --- CHẾ ĐỘ TỐI (DARK MODE) ---
    window.toggleTheme = function() {
        const body = document.body;
        const btn = document.querySelector('.theme-switch');
        if (body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = "☀️ CHẾ ĐỘ SÁNG";
            localStorage.setItem('theme', 'dark');
        } else {
            body.setAttribute('data-theme', 'light');
            btn.innerText = "🌙 CHẾ ĐỘ TỐI";
            localStorage.setItem('theme', 'light');
        }
    }
    // Khôi phục theme đã lưu
    if (localStorage.getItem('theme') === 'dark') toggleTheme();

    // --- LOGIC FIREWORKS ---
    function launchFireworks() {
        var end = Date.now() + (3 * 1000);
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#ffd700'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#ffd700'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    // --- FIREBASE DATA ---
    const visitRef = ref(db, 'visitCount_viewKQ');
    onValue(visitRef, (s) => { if(s.exists()) document.getElementById('visit-count').innerText = s.val().toLocaleString(); });

    const config = [
        { key: 'db', name: 'Giải Đặc Biệt' }, { key: 'g1', name: 'Giải Nhất' },
        { key: 'g2', name: 'Giải Nhì' }, { key: 'g3', name: 'Giải Ba' },
        { key: 'g4', name: 'Giải Tư' }, { key: 'g5', name: 'Giải Năm' },
        { key: 'g6', name: 'Giải Sáu' }, { key: 'gkk', name: 'Giải Khuyến Khích' }
    ];

    let currentResults = {};
    onValue(ref(db, 'lottery_results'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        currentResults = data;
        const tbody = document.getElementById('viewTable');
        tbody.innerHTML = '';
        config.forEach(p => {
            let res = data[p.key];
            let nums = Array.isArray(res) ? res.filter(n => n).join(' - ') : (res || '---');
            const isDB = p.key === 'db' ? 'db-highlight' : '';
            tbody.innerHTML += `<tr><td class="prize-name">${p.name}</td><td style="font-weight:bold" class="${isDB}">${nums}</td></tr>`;
        });
    });

    // --- DÒ SỐ ---
    window.checkWinner = function() {
        const ticket = document.getElementById('userTicket').value.trim();
        const msg = document.getElementById('checkMessage');
        if (!ticket) return;

        showRandomWish(); // Hiển thị câu chúc mỗi lần dò

        let won = null;
        for (const p of config) {
            const results = currentResults[p.key];
            const checkArray = Array.isArray(results) ? results : (results ? [results] : []);
            if (checkArray.some(n => n && n.toString() === ticket)) {
                won = p.name; break;
            }
        }

        if (won) {
            msg.innerHTML = `<span style="color: #4caf50">🎉 TRÚNG RỒI! Bạn trúng ${won}! 🧧</span>`;
            document.getElementById('winSound').play().catch(()=>{});
            launchFireworks();
        } else {
            msg.innerHTML = `<span style="color: var(--tet-red)">😢 Tiếc quá, chưa trúng rồi!</span>`;
        }
    };

    document.getElementById('userTicket').addEventListener('keypress', (e) => { if(e.key==='Enter') window.checkWinner(); });
    document.getElementById('btnCheck').addEventListener('click', window.checkWinner);
</script>
</body>
</html>
