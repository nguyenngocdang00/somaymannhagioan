<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Tra Cứu Số May Mắn - Nhà Gioan</title>
    <meta name="description" content="Chương trình quay số may mắn chúc mừng năm mới 2026 dành riêng cho gia đình nhà Gioan.">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nguyenngocdang00.github.io/somaymannhagioan/soxonhagioan/ketquaXoSo.html"> 
    <meta property="og:title" content="🧧 Tra Cứu Số May Mắn - Nhà Gioan 🧧">
    <meta property="og:description" content="Cùng thử vận may đầu năm với chương trình quay số hấp dẫn. Chúc mừng năm mới 2026!">
    <meta property="og:image" content="https://nguyenngocdang00.github.io/somaymannhagioan/soxonhagioan/tao-vong-quay-may-man-2.png"> 
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="🧧 Tra Cứu Số May Mắn - Nhà Gioan 🧧">
    <meta property="twitter:description" content="Cùng thử vận may đầu năm 2026!">
    <meta property="twitter:image" content="https://nguyenngocdang00.github.io/somaymannhagioan/soxonhagioan/tao-vong-quay-may-man-2.png">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --tet-red: #d32f2f; 
            --tet-gold: #ffc107; 
            --dark-red: #b71c1c;
            --bg-color: #fdf2f2;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#ffebee 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container { 
            max-width: 900px; 
            width: 100%;
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            border: 3px solid var(--tet-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            position: relative;
        }

        h1 { 
            text-align: center; 
            color: var(--tet-red); 
            font-size: clamp(1.2rem, 5vw, 1.8rem); 
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .header-title { 
            text-align: center; 
            color: var(--tet-red); 
            font-size: clamp(1rem, 4vw, 1.3rem);
            background: #fff9c4;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .check-box { 
            background: #fffde7; 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            display: flex; 
            gap: 10px; 
            border: 1px dashed var(--tet-gold);
        }

        input { 
            flex: 1; 
            padding: 12px; 
            border: 2px solid #eee; 
            border-radius: 8px; 
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--tet-red); }

        button { 
            padding: 12px 25px; 
            background: linear-gradient(135deg, var(--tet-red), var(--dark-red)); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 0 #880e4f;
        }

        button:active { transform: translateY(3px); box-shadow: none; }

        .result-msg { 
            text-align: center; 
            margin: 15px 0; 
            font-weight: bold; 
            font-size: 1.1rem;
            min-height: 30px; 
        }

        /* Responsive Table */
        .table-wrapper { overflow-x: auto; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            border-radius: 10px;
            overflow: hidden;
        }

        th, td { 
            border: 1px solid #ffecb3; 
            padding: 15px 10px; 
            text-align: center; 
        }

        th { 
            background: var(--tet-red); 
            color: white; 
            font-size: 1.1rem;
        }

        .prize-name { 
            font-weight: bold; 
            background: #fff3f3; 
            color: var(--tet-red); 
            width: 30%; 
        }

        .prize-numbers { 
            font-size: 1.1rem; 
            font-weight: bold; 
            letter-spacing: 2px; 
            color: #333; 
        }

        .db-highlight { 
            color: #d32f2f; 
            font-size: 1.6rem; 
            text-shadow: 1px 1px 0px #ffc107;
        }

        /* Visitor Counter */
        .visitor-counter {
            position: fixed; bottom: 20px; left: 20px; 
            background: white;
            padding: 8px 15px; border-radius: 50px; 
            border: 2px solid var(--tet-gold);
            font-size: 0.85rem; font-weight: bold; color: var(--tet-red);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .check-box { flex-direction: column; }
            .visitor-counter { bottom: 10px; left: 10px; font-size: 0.75rem; }
            .prize-numbers { font-size: 0.95rem; letter-spacing: 1px; }
            th, td { padding: 10px 5px; }
        }
    </style>
</head>
<body>

<div class="visitor-counter">
    LƯỢT TRUY CẬP: <span id="visit-count">0000</span>
</div>

<div class="container">
    <h1>🏆 KẾT QUẢ QUAY SỐ HÔM NAY</h1>
    <h3 class="header-title">🧧 Quay Số May Mắn Chúc Mừng Năm Mới nhà Gioan 🧧</h3>
    
    <div class="check-box">
        <input type="text" id="userTicket" maxlength="4" placeholder="Nhập số vé của bạn (vd: 1234)">
        <button id="btnCheck">DÒ SỐ</button>
    </div>
    <div id="checkMessage" class="result-msg"></div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Giải</th><th>Số Trúng Thưởng</th></tr>
            </thead>
            <tbody id="viewTable">
                <tr><td colspan="2">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const encodedURL = "aHR0cHM6Ly9zb3hvbmhhZ2lvYW4tZGVmYXVsdC1ydGRiLmFzaWEtc291dGhlYXN0MS5maXJlYmFzZWRhdGFiYXNlLmFwcA==";
    const firebaseConfig = { databaseURL: atob(encodedURL) };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const visitRef = ref(db, 'visitCount_viewKQ');
    const lastVisit = localStorage.getItem('hasVisited_Lottery_Time_KQ');
    const now = new Date().getTime();

    if (!lastVisit || (now - lastVisit > 15 * 60 * 1000)) {
        runTransaction(visitRef, (val) => (val || 0) + 1);
        localStorage.setItem('hasVisited_Lottery_Time_KQ', now);
    }

    onValue(visitRef, (s) => {
        if (s.exists()) document.getElementById('visit-count').innerText = s.val().toLocaleString();
    });

    function launchFireworks() {
        var end = Date.now() + (4 * 1000);
        var colors = ['#ff0000', '#ffd700', '#ffffff'];
        (function frame() {
            confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
            confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    const config = [
        { key: 'db', name: 'Giải Đặc Biệt' },
        { key: 'g1', name: 'Giải Nhất' }, { key: 'g2', name: 'Giải Nhì' },
        { key: 'g3', name: 'Giải Ba' }, { key: 'g4', name: 'Giải Tư' },
        { key: 'g5', name: 'Giải Năm' }, { key: 'g6', name: 'Giải Sáu' },
        { key: 'gkk', name: 'Giải Khuyến Khích' }
    ];

    let currentResults = {};
    onValue(ref(db, 'lottery_results'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        currentResults = data;
        const tbody = document.getElementById('viewTable');
        tbody.innerHTML = '';
        config.forEach(p => {
            let res = data[p.key];
            let nums = Array.isArray(res) ? res.filter(n => n).join(' - ') : (res || '---');
            const isDB = p.key === 'db' ? 'db-highlight' : '';
            tbody.innerHTML += `<tr><td class="prize-name">${p.name}</td><td class="prize-numbers ${isDB}">${nums}</td></tr>`;
        });
    });

    window.checkWinner = function() {
        const ticket = document.getElementById('userTicket').value.trim();
        const msg = document.getElementById('checkMessage');
        if (!ticket) return;
        let won = null;
        for (const p of config) {
            const results = currentResults[p.key];
            const checkArray = Array.isArray(results) ? results : (results ? [results] : []);
            if (checkArray.some(n => n && n.toString() === ticket)) {
                won = p.name; break;
            }
        }
        if (won) {
            msg.innerHTML = `<span style="color: #2e7d32">🎉 Tuyệt vời! Bạn trúng ${won}! 🧧</span>`;
            launchFireworks();
        } else {
            msg.innerHTML = `<span style="color: #d32f2f">😢 Chúc bạn may mắn lần sau!</span>`;
        }
    };

    document.getElementById('userTicket').addEventListener('keypress', (e) => { if (e.key === 'Enter') window.checkWinner(); });
    document.getElementById('btnCheck').addEventListener('click', window.checkWinner);
</script>
</body>
</html>
